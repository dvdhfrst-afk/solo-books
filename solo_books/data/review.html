<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue - solo-books</title>
<style nonce="__NONCE__">
:root {
  color-scheme: light dark;
  --bg: oklch(0.975 0.005 160);
  --panel: oklch(0.995 0.003 160);
  --ink: oklch(0.26 0.012 160);
  --muted: oklch(0.5 0.012 160);
  --line: oklch(0.89 0.008 160);
  --accent: oklch(0.45 0.09 165);
  --accent-ink: oklch(0.985 0.005 165);
  --bad: oklch(0.5 0.15 28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.2 0.008 160);
    --panel: oklch(0.25 0.009 160);
    --ink: oklch(0.93 0.006 160);
    --muted: oklch(0.72 0.01 160);
    --line: oklch(0.34 0.01 160);
    --accent: oklch(0.72 0.1 165);
    --accent-ink: oklch(0.2 0.01 165);
    --bad: oklch(0.75 0.13 28);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  position: sticky; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
h1 { font-size: 16px; margin: 0; font-weight: 600; }
#count { color: var(--muted); }
#filter { margin-left: auto; }
main { max-width: 860px; margin: 0 auto; padding: 16px 12px 96px; }
.group {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
}
.head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.merchant { font-weight: 600; overflow-wrap: anywhere; }
.biz { color: var(--muted); font-size: 13px; }
.total { margin-left: auto; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
td { padding: 3px 6px 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.when, td.money { white-space: nowrap; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
td.money { text-align: right; padding-right: 0; }
td.desc { overflow-wrap: anywhere; }
td.acct { color: var(--muted); font-size: 13px; }
td.pick { width: 24px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
select, button { font: inherit; min-height: 36px; }
select { max-width: 100%; padding: 4px 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
button { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: 0.5; cursor: default; }
button, select { transition: opacity 120ms cubic-bezier(0.32, 0.72, 0, 1); }
label.rule { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
#status {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 3;
  max-width: 836px; margin: 0 auto;
  display: none; gap: 12px; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  background: var(--ink); color: var(--bg);
  border-radius: 8px;
}
#status.on { display: flex; }
#status.bad { background: var(--bad); }
#status button { background: transparent; color: inherit; border-color: currentColor; min-height: 32px; }
.done { padding: 48px 16px; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  td.acct { display: none; }
  .total { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>Review queue</h1>
  <span id="count"></span>
  <select id="filter" aria-label="Show business"></select>
</header>
<main id="queue"></main>
<div id="status" role="status" aria-live="polite"><span id="status-text"></span><button id="undo" type="button">Undo</button></div>
<script nonce="__NONCE__">
"use strict";
const RUN_TOKEN = "__TOKEN__";
const ROWS_SHOWN = 5;
let state = null;
let lastAction = null;

const el = (tag, props, ...kids) => {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  kids.forEach((kid) => node.append(kid));
  return node;
};

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Solo-Books-Token": RUN_TOKEN },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "request failed");
  return data;
}

function show(message, canUndo, bad) {
  const box = document.getElementById("status");
  document.getElementById("status-text").textContent = message;
  document.getElementById("undo").style.display = canUndo ? "" : "none";
  box.className = "on" + (bad ? " bad" : "");
}

const KIND_LABELS = {
  income: "Income", returns: "Income", cogs: "Cost of goods sold",
  expense: "Expenses", transfer: "Not income or expense", equity: "Not income or expense",
};
const KIND_ORDER = ["Expenses", "Not income or expense", "Income", "Cost of goods sold"];

function categorySelect(business) {
  const select = el("select", { "ariaLabel": "Category" });
  select.append(el("option", { value: "", textContent: "Choose a category" }));
  KIND_ORDER.forEach((label) => {
    const group = el("optgroup", { label });
    business.categories
      .filter((category) => KIND_LABELS[category.kind] === label)
      .forEach((category) => group.append(
        el("option", { value: category.code, textContent: category.code + " " + category.name })
      ));
    select.append(group);
  });
  return select;
}

function renderGroup(group, business) {
  const checks = [];
  const table = el("table");
  group.rows.forEach((row) => {
    const check = el("input", { type: "checkbox", checked: true, "ariaLabel": "Include this row" });
    check.dataset.id = row.id;
    checks.push(check);
    const tr = el("tr", {},
      el("td", { className: "pick" }, check),
      el("td", { className: "when", textContent: row.date }),
      el("td", { className: "desc", textContent: row.description }),
      el("td", { className: "acct", textContent: row.account }),
      el("td", { className: "money", textContent: row.amount }),
    );
    table.append(tr);
  });

  const select = categorySelect(business);
  const makeRule = el("input", { type: "checkbox" });
  const book = el("button", { type: "button", className: "primary", textContent: "Book" });
  const transfer = el("button", { type: "button", textContent: "Transfer" });
  const send = async (code) => {
    const ids = checks.filter((c) => c.checked).map((c) => Number(c.dataset.id));
    if (!code) { show("Choose a category first.", false, true); return; }
    if (!ids.length) { show("Tick at least one row.", false, true); return; }
    book.disabled = transfer.disabled = true;
    try {
      const body = { ids, category: code };
      if (makeRule.checked) {
        body.rule_pattern = group.merchant;
        body.unticked_ids = checks.filter((c) => !c.checked).map((c) => Number(c.dataset.id));
      }
      const result = await post("/api/categorize", body);
      lastAction = { ids: result.ids, rule_id: result.rule_id };
      const total = result.booked + result.by_rule;
      show(total + " booked to " + result.category + (result.rule_id ? ", rule added" : ""), true, false);
      await load();
    } catch (error) {
      show(error.message, false, true);
      book.disabled = transfer.disabled = false;
    }
  };
  book.addEventListener("click", () => send(select.value));
  const transferCategory = business.categories.find((c) => c.kind === "transfer");
  transfer.addEventListener("click", () => send(transferCategory && transferCategory.code));

  // Long groups stay short so the next merchant is one glance away. Hidden rows are still ticked.
  const section = el("section", { className: "group" },
    el("div", { className: "head" },
      el("span", { className: "merchant", textContent: group.merchant }),
      el("span", { className: "biz", textContent: group.business + ", " + group.rows.length + (group.rows.length === 1 ? " row" : " rows") }),
      el("span", { className: "total", textContent: group.total }),
    ),
    el("div", { className: "actions" },
      select, book, transfer,
      el("label", { className: "rule" }, makeRule, "Always book " + group.merchant + " this way"),
    ),
    table,
  );
  const hidden = [...table.rows].slice(ROWS_SHOWN);
  if (hidden.length) {
    hidden.forEach((tr) => { tr.hidden = true; });
    const more = el("button", { type: "button", textContent: "Show " + hidden.length + " more rows" });
    more.addEventListener("click", () => {
      hidden.forEach((tr) => { tr.hidden = false; });
      more.remove();
    });
    section.append(more);
  }
  return section;
}

function render() {
  const filter = document.getElementById("filter");
  const chosen = filter.value;
  filter.replaceChildren(el("option", { value: "", textContent: "All businesses" }));
  state.businesses.forEach((b) => filter.append(el("option", { value: String(b.id), textContent: b.name })));
  filter.value = chosen;

  const groups = state.groups.filter((g) => !filter.value || String(g.business_id) === filter.value);
  const rows = groups.reduce((sum, g) => sum + g.rows.length, 0);
  document.getElementById("count").textContent = rows + " rows waiting, " + groups.length + " merchants";

  const queue = document.getElementById("queue");
  queue.replaceChildren();
  if (!groups.length) {
    queue.append(el("p", { className: "done", textContent: "Nothing waiting for review." }));
    return;
  }
  const byId = new Map(state.businesses.map((b) => [b.id, b]));
  groups.forEach((group) => queue.append(renderGroup(group, byId.get(group.business_id))));
}

async function load() {
  const response = await fetch("/api/queue");
  state = await response.json();
  render();
}

document.getElementById("filter").addEventListener("change", render);
document.getElementById("undo").addEventListener("click", async () => {
  if (!lastAction) return;
  try {
    const result = await post("/api/undo", lastAction);
    lastAction = null;
    show(result.returned + " rows back in the queue", false, false);
    await load();
  } catch (error) {
    show(error.message, false, true);
  }
});
load().catch((error) => show(error.message, false, true));
</script>
</body>
</html>
