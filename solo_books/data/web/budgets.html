<form id="pick" class="fields panel">
  <label>Business <select id="b-business"></select></label>
  <label>Year <input id="b-year" type="number" min="1900" max="2100" size="6" required></label>
  <button type="submit">Show</button>
</form>
<section class="panel" aria-labelledby="list-title">
  <h2 id="list-title">Budgets</h2>
  <p class="muted">Amounts are positive for income and for spending alike. The Reports page sets them against the books.</p>
  <div id="list"><p class="muted">Loading...</p></div>
</section>
<section class="panel" aria-labelledby="set-title">
  <h2 id="set-title">Set a budget</h2>
  <form id="set" class="fields">
    <label>Category <select id="s-category" required></select></label>
    <label>For the year <input id="s-yearly" inputmode="decimal" size="12" placeholder="1200.00"></label>
    <label>Or each month <input id="s-monthly" inputmode="decimal" size="12" placeholder="100.00"></label>
    <label>Only this month <select id="s-month">
      <option value="">Every month</option>
      <option value="1">January</option><option value="2">February</option><option value="3">March</option>
      <option value="4">April</option><option value="5">May</option><option value="6">June</option>
      <option value="7">July</option><option value="8">August</option><option value="9">September</option>
      <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select></label>
    <button type="submit" class="primary">Save the budget</button>
  </form>
  <p class="muted">Give a yearly amount, or a monthly one. A monthly amount with one month chosen changes that month only.</p>
</section>
